<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header>
  <div class="header-left">
    <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" class="logo-img" alt="CNA">
    <h1 class="header-title">CRM CNA</h1>
  </div>
  <div class="header-right-wrap">
    <div class="user-chip">
      <span id="user-name">...</span>
      <div class="user-dot"></div>
    </div>
    <button class="btn btn-logout" onclick="doLogout()">Esci</button>
  </div>
</header>

<div class="tabs-bar" id="nav-tabs">
  <button class="tab-btn active">📊 Dashboard</button>
  <button class="tab-btn" onclick="go('pages/statistiche.html')">📈 Statistiche</button>
  <button class="tab-btn" id="t-comm" style="display:none" onclick="go('pages/commerciali.html')">👥 Commerciali</button>
  <button class="tab-btn" id="t-prov" style="display:none" onclick="go('pages/provvigioni.html')">💰 Provvigioni</button>
  <button class="tab-btn" id="t-tipi" style="display:none" onclick="go('pages/tipi-contratto.html')">📋 Tipi Contratto</button>
  <button class="tab-btn" onclick="go('pages/campagne.html')">🎯 Campagne</button>
</div>

<div class="page active">

  <div class="filters-bar">
    <div class="filter-group">
      <label>STATO</label>
      <select class="form-input" id="f-stato" onchange="renderTable()">
        <option value="">Tutti</option>
        <option value="firmato">Firmato</option>
        <option value="in_attesa">In attesa</option>
      </select>
    </div>
    <div class="filter-group" id="f-u-wrap" style="display:none">
      <label>UTENTE</label>
      <select class="form-input" id="f-utente" onchange="renderTable()">
        <option value="">Tutti</option>
      </select>
    </div>
    <div class="filter-actions">
      <button class="btn btn-secondary" onclick="resetFiltri()">✕ Reset</button>
    </div>
  </div>

  <div class="kpi-strip">
    <div class="kpi-card c1"><div class="kpi-label">Contratti Totali</div><div class="kpi-value" id="k1">—</div></div>
    <div class="kpi-card c2"><div class="kpi-label">Firmati</div><div class="kpi-value" id="k2">—</div></div>
    <div class="kpi-card c3"><div class="kpi-label">In Attesa</div><div class="kpi-value" id="k3">—</div></div>
    <div class="kpi-card c4"><div class="kpi-label">Questo Mese</div><div class="kpi-value" id="k4">—</div></div>
  </div>

  <div class="table-card">
    <div class="table-card-header">
      <h3>📄 Tutti i Contratti da Signature</h3>
      <span id="cnt-badge">caricamento...</span>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Ragione Sociale</th>
            <th>Nome</th>
            <th>Tipo Contratto</th>
            <th>Data</th>
            <th>Creato Da</th>
            <th>Stato</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" style="text-align:center;padding:40px;color:#94A3B8">Caricamento dati...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
const URL = 'https://ohahuqlfzqckaevaffbt.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020';

// ---- AUTH ----
const sess = localStorage.getItem('cna_crm');
if (!sess) { location.href = 'index.html'; }
const me = JSON.parse(sess);

document.getElementById('user-name').textContent = me.nome + ' ' + me.cognome;

if (me.ruolo === 'admin' || me.ruolo === 'supervisore') {
  document.getElementById('t-comm').style.display = '';
  document.getElementById('t-prov').style.display = '';
}
if (me.ruolo === 'admin') {
  document.getElementById('t-tipi').style.display = '';
  document.getElementById('f-u-wrap').style.display = '';
}

function go(url) { location.href = url; }
function doLogout() { localStorage.removeItem('cna_crm'); location.href = 'index.html'; }

// ---- API ----
async function get(ep) {
  const r = await fetch(URL + '/rest/v1/' + ep, {
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  return Array.isArray(d) ? d : [];
}

function fmtDate(s) {
  if (!s) return '-';
  return new Date(s).toLocaleDateString('it-IT');
}

// ---- DATA ----
let contratti = [];
let utenti = [];

async function init() {
  try {
    // Carica utenti per nomi e filtro
    utenti = await get('cna_users?select=id,nome,cognome&attivo=eq.true&order=nome');

    if (me.ruolo === 'admin') {
      const sel = document.getElementById('f-utente');
      utenti.forEach(u => {
        const o = document.createElement('option');
        o.value = u.id;
        o.textContent = u.nome + ' ' + u.cognome;
        sel.appendChild(o);
      });
    }

    // Carica contratti
    let ep = 'contratti?select=id,ragione_sociale,nome,cognome,stato,tipo_contratto,created_by,created_at&order=created_at.desc';
    if (me.ruolo !== 'admin') ep += '&created_by=eq.' + me.id;
    contratti = await get(ep);

    renderTable();
  } catch(e) {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="6" style="text-align:center;padding:40px;color:#EF4444">Errore: ' + e.message + '</td></tr>';
  }
}

function renderTable() {
  let list = contratti.slice();

  const fStato = document.getElementById('f-stato').value;
  if (fStato) list = list.filter(c => c.stato === fStato);

  if (me.ruolo === 'admin') {
    const fUtente = document.getElementById('f-utente').value;
    if (fUtente) list = list.filter(c => c.created_by === fUtente);
  }

  // KPI
  const ora = new Date();
  const inizioMese = new Date(ora.getFullYear(), ora.getMonth(), 1);
  document.getElementById('k1').textContent = list.length;
  document.getElementById('k2').textContent = list.filter(c => c.stato === 'firmato').length;
  document.getElementById('k3').textContent = list.filter(c => c.stato !== 'firmato').length;
  document.getElementById('k4').textContent = list.filter(c => new Date(c.created_at) >= inizioMese).length;
  document.getElementById('cnt-badge').textContent = list.length + ' contratti';

  // Tabella
  const tbody = document.getElementById('tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#94A3B8">Nessun contratto trovato</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(c => {
    const u = utenti.find(x => x.id === c.created_by);
    const nome = ((c.nome || '') + ' ' + (c.cognome || '')).trim() || '-';
    const utente = u ? u.nome + ' ' + u.cognome : '-';
    const data = fmtDate(c.created_at);
    const tipo = c.tipo_contratto || 'modulo adesione';
    const stato = c.stato || 'in attesa';
    const badgeCls = stato === 'firmato' ? 'success' : 'warning';

    return '<tr>' +
      '<td><strong>' + (c.ragione_sociale || '-') + '</strong></td>' +
      '<td>' + nome + '</td>' +
      '<td><span class="badge info">' + tipo + '</span></td>' +
      '<td>' + data + '</td>' +
      '<td>' + utente + '</td>' +
      '<td><span class="badge ' + badgeCls + '">' + stato + '</span></td>' +
      '</tr>';
  }).join('');
}

function resetFiltri() {
  document.getElementById('f-stato').value = '';
  if (me.ruolo === 'admin') document.getElementById('f-utente').value = '';
  renderTable();
}

init();
</script>
</body>
</html>
