<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div class="tabs-bar" id="nav"></div>
  <div class="page active">

    <div class="filters-bar">
      <div class="filter-group">
        <label>STATO</label>
        <select class="form-input" id="f-stato" onchange="render()">
          <option value="">Tutti</option>
          <option value="firmato">Firmato</option>
          <option value="in_attesa">In attesa</option>
        </select>
      </div>
      <div class="filter-group" id="f-utente-wrap" style="display:none">
        <label>UTENTE</label>
        <select class="form-input" id="f-utente" onchange="render()">
          <option value="">Tutti</option>
        </select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-secondary" onclick="resetF()">✕ Reset</button>
      </div>
    </div>

    <div class="kpi-strip">
      <div class="kpi-card c1"><div class="kpi-label">Contratti Totali</div><div class="kpi-value" id="k1">0</div></div>
      <div class="kpi-card c2"><div class="kpi-label">Firmati</div><div class="kpi-value" id="k2">0</div></div>
      <div class="kpi-card c3"><div class="kpi-label">In Attesa</div><div class="kpi-value" id="k3">0</div></div>
      <div class="kpi-card c4"><div class="kpi-label">Questo Mese</div><div class="kpi-value" id="k4">0</div></div>
    </div>

    <div class="table-card">
      <div class="table-card-header">
        <h3>📄 Contratti da Signature</h3>
        <span id="cnt">0 contratti</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Ragione Sociale</th>
              <th>Nome</th>
              <th>Tipo Contratto</th>
              <th>Data</th>
              <th>Creato Da</th>
              <th>Stato</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>
<script src="js/crm.js"></script>
<script>
const me = Auth.check('index.html');
if (!me) throw new Error('not auth');

document.getElementById('hdr').innerHTML = buildHeader(me);
document.getElementById('nav').innerHTML = buildNav('📊 Dashboard', '');

if (me.ruolo === 'admin') {
  document.getElementById('f-utente-wrap').style.display = 'block';
}

let contratti = [];
let users = [];

async function init() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px">Caricamento...</td></tr>';
  try {
    // Carica utenti
    users = await api('cna_users?select=id,nome,cognome&attivo=eq.true&order=nome');
    
    if (me.ruolo === 'admin') {
      const sel = document.getElementById('f-utente');
      users.forEach(u => {
        const o = document.createElement('option');
        o.value = u.id;
        o.textContent = u.nome + ' ' + u.cognome;
        sel.appendChild(o);
      });
    }

    // Carica contratti
    let q = 'contratti?select=id,ragione_sociale,nome,cognome,stato,tipo_contratto,created_by,created_at,quota_primo_anno_importo&order=created_at.desc';
    if (me.ruolo !== 'admin') q += '&created_by=eq.' + me.id;
    contratti = await api(q);
    render();

  } catch(ex) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#EF4444">Errore: ' + ex.message + '</td></tr>';
  }
}

function render() {
  let list = contratti.slice();

  const stato = document.getElementById('f-stato').value;
  if (stato) list = list.filter(c => c.stato === stato);

  if (me.ruolo === 'admin') {
    const uid = document.getElementById('f-utente').value;
    if (uid) list = list.filter(c => c.created_by === uid);
  }

  // KPI
  const now = new Date(); const sm = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('k1').textContent = list.length;
  document.getElementById('k2').textContent = list.filter(c => c.stato === 'firmato').length;
  document.getElementById('k3').textContent = list.filter(c => c.stato !== 'firmato').length;
  document.getElementById('k4').textContent = list.filter(c => new Date(c.created_at) >= sm).length;
  document.getElementById('cnt').textContent = list.length + ' contratti';

  const tbody = document.getElementById('tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px">Nessun contratto trovato</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(c => {
    const u = users.find(x => x.id === c.created_by);
    return '<tr>' +
      '<td><strong>' + (c.ragione_sociale || '-') + '</strong></td>' +
      '<td>' + ((c.nome||'') + ' ' + (c.cognome||'')).trim() + '</td>' +
      '<td>' + badge(c.tipo_contratto || 'modulo adesione', 'info') + '</td>' +
      '<td>' + fmt_date(c.created_at) + '</td>' +
      '<td>' + (u ? u.nome + ' ' + u.cognome : '-') + '</td>' +
      '<td>' + badge(c.stato || 'in attesa', c.stato === 'firmato' ? 'success' : 'warning') + '</td>' +
      '</tr>';
  }).join('');
}

function resetF() {
  document.getElementById('f-stato').value = '';
  if (me.ruolo === 'admin') document.getElementById('f-utente').value = '';
  render();
}

init();
</script>
</body>
</html>
