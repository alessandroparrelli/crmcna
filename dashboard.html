<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="loading-overlay" style="display:none">
    <div class="spinner"></div>
    <div class="loading-msg">Caricamento...</div>
  </div>

  <div id="app">
    <header>
      <div class="header-left">
        <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" alt="CNA Roma" class="logo-img">
        <h1 class="header-title">CRM CNA</h1>
      </div>
      <div class="header-right-wrap">
        <div class="user-chip">
          <span id="user-name"></span>
          <div class="user-dot"></div>
        </div>
        <button class="btn btn-logout" onclick="doLogout()">Esci</button>
      </div>
    </header>

    <div class="tabs-bar">
      <button class="tab-btn active">📊 Dashboard</button>
      <button class="tab-btn" onclick="go('pages/statistiche.html')">📈 Statistiche</button>
      <button class="tab-btn" id="tab-commerciali" style="display:none" onclick="go('pages/commerciali.html')">👥 Commerciali</button>
      <button class="tab-btn" id="tab-provvigioni" style="display:none" onclick="go('pages/provvigioni.html')">💰 Provvigioni</button>
      <button class="tab-btn" id="tab-tipi" style="display:none" onclick="go('pages/tipi-contratto.html')">📋 Tipi Contratto</button>
      <button class="tab-btn" onclick="go('pages/campagne.html')">🎯 Campagne</button>
    </div>

    <div class="page active">
      <div class="filters-bar">
        <div class="filter-group">
          <label>STATO</label>
          <select class="form-input" id="filter-stato" onchange="applyFilters()">
            <option value="">Tutti</option>
            <option value="firmato">Firmato</option>
            <option value="in_attesa">In attesa</option>
          </select>
        </div>
        <div class="filter-group" id="filter-utente-group" style="display:none">
          <label>UTENTE</label>
          <select class="form-input" id="filter-utente" onchange="applyFilters()">
            <option value="">Tutti</option>
          </select>
        </div>
        <div class="filter-actions">
          <button class="btn btn-secondary" onclick="resetFilters()">✕ Reset</button>
        </div>
      </div>

      <div class="kpi-strip">
        <div class="kpi-card c1">
          <div class="kpi-label">Contratti Totali</div>
          <div class="kpi-value" id="kpi-totali">0</div>
        </div>
        <div class="kpi-card c2">
          <div class="kpi-label">Firmati</div>
          <div class="kpi-value" id="kpi-firmati">0</div>
        </div>
        <div class="kpi-card c3">
          <div class="kpi-label">In Attesa</div>
          <div class="kpi-value" id="kpi-attesa">0</div>
        </div>
        <div class="kpi-card c4">
          <div class="kpi-label">Questo Mese</div>
          <div class="kpi-value" id="kpi-mese">0</div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-card-header">
          <h3>📄 Tutti i Contratti da Signature</h3>
          <span id="badge-count">0 contratti</span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Ragione Sociale</th>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Data</th>
                <th>Creato Da</th>
                <th>Stato</th>
              </tr>
            </thead>
            <tbody id="table-contratti">
              <tr><td colspan="6" style="text-align:center;padding:40px">Caricamento...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://ohahuqlfzqckaevaffbt.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020';

    // Auth
    const session = localStorage.getItem('cna_crm_session');
    if (!session) { window.location.href = 'index.html'; throw new Error('Not authenticated'); }
    const me = JSON.parse(session);

    document.getElementById('user-name').textContent = me.nome + ' ' + me.cognome + ' (' + me.ruolo + ')';

    if (me.ruolo === 'admin' || me.ruolo === 'supervisore') {
      document.getElementById('tab-commerciali').style.display = 'inline-flex';
      document.getElementById('tab-provvigioni').style.display = 'inline-flex';
    }
    if (me.ruolo === 'admin') {
      document.getElementById('tab-tipi').style.display = 'inline-flex';
      document.getElementById('filter-utente-group').style.display = 'block';
    }

    function go(url) { window.location.href = url; }
    function doLogout() { localStorage.removeItem('cna_crm_session'); window.location.href = 'index.html'; }

    async function api(endpoint) {
      const res = await fetch(SB_URL + '/rest/v1/' + endpoint, {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    let allContratti = [];
    let allUsers = [];

    async function init() {
      try {
        // Carica utenti
        allUsers = await api('cna_users?select=id,nome,cognome&attivo=eq.true&order=nome');

        if (me.ruolo === 'admin') {
          const sel = document.getElementById('filter-utente');
          allUsers.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.nome + ' ' + u.cognome;
            sel.appendChild(opt);
          });
        }

        // Carica contratti
        let q = 'contratti?select=*&order=created_at.desc';
        if (me.ruolo !== 'admin') q += '&created_by=eq.' + me.id;
        allContratti = await api(q);

        renderTable(allContratti);
      } catch (e) {
        document.getElementById('table-contratti').innerHTML =
          '<tr><td colspan="6" style="text-align:center;padding:40px;color:#EF4444">Errore: ' + e.message + '</td></tr>';
      }
    }

    function applyFilters() {
      let filtered = allContratti;

      const stato = document.getElementById('filter-stato').value;
      if (stato) filtered = filtered.filter(c => c.stato === stato);

      if (me.ruolo === 'admin') {
        const utente = document.getElementById('filter-utente').value;
        if (utente) filtered = filtered.filter(c => c.created_by === utente);
      }

      renderTable(filtered);
    }

    function resetFilters() {
      document.getElementById('filter-stato').value = '';
      if (me.ruolo === 'admin') document.getElementById('filter-utente').value = '';
      renderTable(allContratti);
    }

    function renderTable(list) {
      const now = new Date();
      const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);

      document.getElementById('kpi-totali').textContent = list.length;
      document.getElementById('kpi-firmati').textContent = list.filter(c => c.stato === 'firmato').length;
      document.getElementById('kpi-attesa').textContent = list.filter(c => c.stato !== 'firmato').length;
      document.getElementById('kpi-mese').textContent = list.filter(c => new Date(c.created_at) >= startMonth).length;
      document.getElementById('badge-count').textContent = list.length + ' contratti';

      const tbody = document.getElementById('table-contratti');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px">Nessun contratto trovato</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(c => {
        const u = allUsers.find(x => x.id === c.created_by);
        const uName = u ? u.nome + ' ' + u.cognome : '-';
        const date = c.created_at ? new Date(c.created_at).toLocaleDateString('it-IT') : '-';
        const badgeClass = c.stato === 'firmato' ? 'success' : 'warning';
        return '<tr>' +
          '<td><strong>' + (c.ragione_sociale || '-') + '</strong></td>' +
          '<td>' + (c.nome || '') + ' ' + (c.cognome || '') + '</td>' +
          '<td><span class="badge">' + (c.tipo_contratto || 'modulo adesione') + '</span></td>' +
          '<td>' + date + '</td>' +
          '<td>' + uName + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + (c.stato || 'in attesa') + '</span></td>' +
          '</tr>';
      }).join('');
    }

    init();
  </script>
</body>
</html>
