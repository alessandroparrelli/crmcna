<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Login</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" alt="CNA Roma" style="max-width:220px;height:auto">
    </div>
    <h2 class="login-title">CRM CNA</h2>
    <p class="login-sub">Accedi con le tue credenziali</p>
    <div id="err" class="login-error"></div>
    <form id="form">
      <div class="form-group">
        <label>Email</label>
        <input type="text" id="email" class="form-input" placeholder="email@esempio.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="pwd" class="form-input" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btn">Accedi</button>
    </form>
  </div>
</div>
<script src="js/crm.js"></script>
<script>
  // Se già loggato vai alla dashboard
  if (Auth.get()) location.href = 'dashboard.html';

  document.getElementById('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    const email = document.getElementById('email').value.trim();
    const pwd = document.getElementById('pwd').value;

    if (!email || !pwd) {
      err.textContent = 'Inserisci email e password';
      err.style.display = 'block';
      return;
    }

    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Accesso in corso...';

    try {
      await Auth.login(email, pwd);
      location.href = 'dashboard.html';
    } catch(ex) {
      err.textContent = ex.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Accedi';
    }
  });
</script>
</body>
</html>
