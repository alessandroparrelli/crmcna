<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Login</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" alt="CNA Roma">
    </div>
    <h2 class="login-title">CRM CNA</h2>
    <p class="login-sub">Accedi con le tue credenziali</p>
    <div id="err" class="login-error"></div>
    <form id="frm" autocomplete="on">
      <div class="form-group">
        <label>Email</label>
        <input type="text" id="email" class="form-input" placeholder="email" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="pwd" class="form-input" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btn">Accedi</button>
    </form>
  </div>
</div>
<script>
const URL = 'https://ohahuqlfzqckaevaffbt.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020';

if (localStorage.getItem('cna_crm')) location.href = 'dashboard.html';

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

document.getElementById('frm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('pwd').value;
  if (!email || !pwd) { err.textContent='Inserisci email e password'; err.style.display='block'; return; }
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Accesso in corso...';
  try {
    const hash = await sha256(pwd);
    const r = await fetch(URL+'/rest/v1/cna_users?email=eq.'+encodeURIComponent(email)+'&password_sha256=eq.'+hash+'&attivo=eq.true&select=id,nome,cognome,email,ruolo', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer '+KEY }
    });
    if (!r.ok) throw new Error('Errore server');
    const users = await r.json();
    if (!users || !users.length) throw new Error('Credenziali non valide');
    const u = users[0];
    localStorage.setItem('cna_crm', JSON.stringify({id:u.id,nome:u.nome,cognome:u.cognome,email:u.email,ruolo:u.ruolo}));
    location.href = 'dashboard.html';
  } catch(ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Accedi';
  }
});
</script>
</body>
</html>
