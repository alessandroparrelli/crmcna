<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Login</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" alt="CNA Roma">
      </div>
      <h2 class="login-title">CRM CNA</h2>
      <p class="login-sub">Accedi con le tue credenziali</p>

      <div id="login-error" class="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="text" id="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-input" required>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Accedi</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Accesso in corso...';

      try {
        await Auth.login(email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Accedi';
      }
    });
  </script>
</body>
</html>
