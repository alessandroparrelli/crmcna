<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" alt="CNA Roma" class="logo-img" style="height:40px">
        <h1 class="header-title">CRM CNA</h1>
      </div>
      <div class="header-right-wrap">
        <span id="user-name"></span>
        <button class="btn btn-logout" onclick="logout()">Esci</button>
      </div>
    </header>

    <div class="page active" style="padding:20px">
      <h2>Dashboard - Contratti</h2>
      
      <div id="stats" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0">
        <div style="background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
          <div style="font-size:32px;font-weight:bold;color:#2563EB" id="total">0</div>
          <div style="color:#64748B">Contratti Totali</div>
        </div>
        <div style="background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
          <div style="font-size:32px;font-weight:bold;color:#10B981" id="firmati">0</div>
          <div style="color:#64748B">Firmati</div>
        </div>
      </div>

      <div style="background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
        <h3>Elenco Contratti</h3>
        <div id="table"></div>
      </div>
    </div>
  </div>

  <script>
const SUPABASE_URL = 'https://ohahuqlfzqckaevaffbt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020';

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Check login
const session = localStorage.getItem('cna_crm_session');
if (!session) {
  window.location.href = 'index.html';
} else {
  const user = JSON.parse(session);
  document.getElementById('user-name').textContent = `${user.nome} ${user.cognome}`;
}

function logout() {
  localStorage.removeItem('cna_crm_session');
  window.location.href = 'index.html';
}

async function loadData() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/contratti?select=*&order=created_at.desc&limit=50`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    
    if (!res.ok) throw new Error('Errore caricamento');
    
    const contratti = await res.json();
    
    // Update stats
    document.getElementById('total').textContent = contratti.length;
    document.getElementById('firmati').textContent = contratti.filter(c => c.stato === 'firmato').length;
    
    // Update table
    const table = document.getElementById('table');
    table.innerHTML = '<table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:2px solid #e2e8f0"><th style="text-align:left;padding:12px">Azienda</th><th style="text-align:left;padding:12px">Nome</th><th style="text-align:left;padding:12px">Data</th><th style="text-align:left;padding:12px">Stato</th></tr></thead><tbody>' +
      contratti.map(c => `
        <tr style="border-bottom:1px solid #e2e8f0">
          <td style="padding:12px"><strong>${c.ragione_sociale || '-'}</strong></td>
          <td style="padding:12px">${c.nome || ''} ${c.cognome || ''}</td>
          <td style="padding:12px">${c.created_at ? new Date(c.created_at).toLocaleDateString('it-IT') : '-'}</td>
          <td style="padding:12px"><span style="background:${c.stato === 'firmato' ? '#D1FAE5' : '#FEF3C7'};color:${c.stato === 'firmato' ? '#065F46' : '#92400E'};padding:4px 12px;border-radius:20px;font-size:12px">${c.stato || 'attesa'}</span></td>
        </tr>
      `).join('') + '</tbody></table>';
    
  } catch (error) {
    document.getElementById('table').innerHTML = '<p style="color:red">Errore: ' + error.message + '</p>';
  }
}

loadData();
  </script>
</body>
</html>
