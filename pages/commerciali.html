<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Commerciali</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div class="tabs-bar" id="nav"></div>
  <div class="page active">
    <h2 style="margin-bottom:20px">👥 Gestione Commerciali</h2>

    <div class="filters-bar">
      <div class="filter-group">
        <label>COMMERCIALE</label>
        <select class="form-input" id="f-comm" onchange="render()">
          <option value="">Tutti</option>
        </select>
      </div>
      <div class="filter-group">
        <label>VALIDAZIONE</label>
        <select class="form-input" id="f-val" onchange="render()">
          <option value="">Tutti</option>
          <option value="0">Da validare</option>
          <option value="1">Validato</option>
        </select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-secondary" onclick="resetF()">✕ Reset</button>
      </div>
    </div>

    <div class="kpi-strip">
      <div class="kpi-card c1"><div class="kpi-label">Totale</div><div class="kpi-value" id="k1">0</div></div>
      <div class="kpi-card c2"><div class="kpi-label">Da Validare</div><div class="kpi-value" id="k2">0</div></div>
      <div class="kpi-card c3"><div class="kpi-label">Validati</div><div class="kpi-value" id="k3">0</div></div>
      <div class="kpi-card c4"><div class="kpi-label">Commerciali</div><div class="kpi-value" id="k4">0</div></div>
    </div>

    <div class="table-card">
      <div class="table-card-header"><h3>📄 Contratti Commerciali</h3><span id="cnt">0</span></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Ragione Sociale</th><th>Tipo</th><th>Data</th><th>Commerciale</th><th>Stato</th><th>Validazione</th><th>Azioni</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../js/crm.js"></script>
<script>
const me = Auth.check('../index.html');
if (me.ruolo !== 'admin' && me.ruolo !== 'supervisore') { alert('Accesso negato'); location.href = '../dashboard.html'; }
document.getElementById('hdr').innerHTML = buildHeader(me);
document.getElementById('nav').innerHTML = buildNav('👥 Commerciali', '../');

let contratti = [], comms = [];

async function init() {
  try {
    comms = await api('cna_users?ruolo=eq.commerciale&attivo=eq.true&select=id,nome,cognome&order=nome');
    document.getElementById('k4').textContent = comms.length;
    const sel = document.getElementById('f-comm');
    comms.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.nome + ' ' + c.cognome; sel.appendChild(o); });

    const ids = comms.map(c => c.id);
    if (ids.length) {
      contratti = await api('contratti?select=id,ragione_sociale,tipo_contratto,created_at,stato,validato,created_by&created_by=in.(' + ids.join(',') + ')&order=created_at.desc');
    }
    render();
  } catch(ex) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="7" style="color:#EF4444;padding:20px">Errore: ' + ex.message + '</td></tr>';
  }
}

function render() {
  let list = contratti.slice();
  const fc = document.getElementById('f-comm').value;
  if (fc) list = list.filter(c => c.created_by === fc);
  const fv = document.getElementById('f-val').value;
  if (fv === '0') list = list.filter(c => !c.validato);
  if (fv === '1') list = list.filter(c => c.validato);

  document.getElementById('k1').textContent = list.length;
  document.getElementById('k2').textContent = list.filter(c => !c.validato).length;
  document.getElementById('k3').textContent = list.filter(c => c.validato).length;
  document.getElementById('cnt').textContent = list.length + ' contratti';

  const tbody = document.getElementById('tbody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px">Nessun contratto</td></tr>'; return; }
  tbody.innerHTML = list.map(c => {
    const u = comms.find(x => x.id === c.created_by);
    return '<tr>' +
      '<td><strong>' + (c.ragione_sociale||'-') + '</strong></td>' +
      '<td>' + (c.tipo_contratto||'-') + '</td>' +
      '<td>' + fmt_date(c.created_at) + '</td>' +
      '<td>' + (u ? u.nome + ' ' + u.cognome : '-') + '</td>' +
      '<td>' + badge(c.stato||'attesa', c.stato==='firmato'?'success':'warning') + '</td>' +
      '<td>' + badge(c.validato ? 'Validato' : 'Da validare', c.validato ? 'success' : 'warning') + '</td>' +
      '<td>' + (!c.validato ? '<button class="btn btn-primary" onclick="valida(\''+c.id+'\')">✓ Valida</button>' : '-') + '</td>' +
      '</tr>';
  }).join('');
}

async function valida(id) {
  if (!confirm('Confermi la validazione?')) return;
  try {
    await api('contratti?id=eq.' + id, 'PATCH', { validato: true });
    const c = contratti.find(x => x.id === id);
    if (c) c.validato = true;
    render();
  } catch(ex) { alert('Errore: ' + ex.message); }
}

function resetF() { document.getElementById('f-comm').value = ''; document.getElementById('f-val').value = ''; render(); }
init();
</script>
</body>
</html>
