<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Statistiche</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div class="tabs-bar" id="nav"></div>
  <div class="page active">
    <h2 style="margin-bottom:20px">📈 Le Mie Statistiche</h2>

    <div class="filters-bar">
      <div class="filter-group">
        <label>PERIODO</label>
        <select class="form-input" id="f-periodo" onchange="load()">
          <option value="all">Tutto il periodo</option>
          <option value="year">Quest'anno</option>
          <option value="month">Questo mese</option>
        </select>
      </div>
    </div>

    <div class="kpi-strip">
      <div class="kpi-card c1"><div class="kpi-label">Contratti</div><div class="kpi-value" id="k1">0</div></div>
      <div class="kpi-card c2"><div class="kpi-label">Firmati</div><div class="kpi-value" id="k2">0</div></div>
      <div class="kpi-card c3"><div class="kpi-label">Conversione</div><div class="kpi-value" id="k3">0%</div></div>
      <div class="kpi-card c4"><div class="kpi-label">Importo Tot.</div><div class="kpi-value" id="k4">€0</div></div>
    </div>

    <div class="table-card">
      <div class="table-card-header"><h3>📊 Per Tipo Contratto</h3></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Tipo</th><th>Totale</th><th>Firmati</th><th>In Attesa</th><th>Conversione</th></tr></thead>
          <tbody id="t-tipo"></tbody>
        </table>
      </div>
    </div>

    <div class="table-card">
      <div class="table-card-header"><h3>📅 Per Mese</h3></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Mese</th><th>Totale</th><th>Firmati</th><th>Conversione</th></tr></thead>
          <tbody id="t-mese"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../js/crm.js"></script>
<script>
const me = Auth.check('../index.html');
document.getElementById('hdr').innerHTML = buildHeader(me);
document.getElementById('nav').innerHTML = buildNav('📈 Statistiche', '../');

async function load() {
  try {
    let q = 'contratti?select=id,stato,tipo_contratto,created_at,quota_primo_anno_importo&created_by=eq.' + me.id + '&order=created_at.desc';
    let list = await api(q);

    const p = document.getElementById('f-periodo').value;
    const now = new Date();
    if (p === 'year') list = list.filter(c => new Date(c.created_at).getFullYear() === now.getFullYear());
    else if (p === 'month') list = list.filter(c => { const d = new Date(c.created_at); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); });

    const firmati = list.filter(c => c.stato === 'firmato');
    const importo = list.reduce((s, c) => s + parseFloat(c.quota_primo_anno_importo || 0), 0);
    const conv = list.length ? (firmati.length / list.length * 100).toFixed(1) : 0;

    document.getElementById('k1').textContent = list.length;
    document.getElementById('k2').textContent = firmati.length;
    document.getElementById('k3').textContent = conv + '%';
    document.getElementById('k4').textContent = '€' + Math.round(importo).toLocaleString('it-IT');

    // Per tipo
    const byTipo = {};
    list.forEach(c => {
      const t = c.tipo_contratto || 'modulo adesione';
      if (!byTipo[t]) byTipo[t] = { tot: 0, firm: 0 };
      byTipo[t].tot++;
      if (c.stato === 'firmato') byTipo[t].firm++;
    });
    document.getElementById('t-tipo').innerHTML = Object.entries(byTipo).length
      ? Object.entries(byTipo).map(([t, s]) =>
          '<tr><td>' + t + '</td><td>' + s.tot + '</td><td>' + s.firm + '</td><td>' + (s.tot - s.firm) + '</td><td>' +
          badge((s.tot ? (s.firm/s.tot*100).toFixed(1) : 0) + '%', 'success') + '</td></tr>').join('')
      : '<tr><td colspan="5" style="text-align:center;padding:20px">Nessun dato</td></tr>';

    // Per mese
    const byMese = {};
    list.forEach(c => {
      const d = new Date(c.created_at);
      const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      if (!byMese[k]) byMese[k] = { tot: 0, firm: 0 };
      byMese[k].tot++;
      if (c.stato === 'firmato') byMese[k].firm++;
    });
    document.getElementById('t-mese').innerHTML = Object.keys(byMese).length
      ? Object.keys(byMese).sort().reverse().map(k => {
          const s = byMese[k]; const [y, m] = k.split('-');
          const nome = new Date(y, m-1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
          return '<tr><td>' + nome + '</td><td>' + s.tot + '</td><td>' + s.firm + '</td><td>' +
            badge((s.tot ? (s.firm/s.tot*100).toFixed(1) : 0) + '%', 'success') + '</td></tr>';
        }).join('')
      : '<tr><td colspan="4" style="text-align:center;padding:20px">Nessun dato</td></tr>';

  } catch(ex) {
    document.getElementById('t-tipo').innerHTML = '<tr><td colspan="5" style="color:#EF4444;padding:20px">Errore: ' + ex.message + '</td></tr>';
  }
}
load();
</script>
</body>
</html>
