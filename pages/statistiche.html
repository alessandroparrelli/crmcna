<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Statistiche</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" class="logo-img" alt="CNA">
    <h1 class="header-title">CRM CNA</h1>
  </div>
  <div class="header-right-wrap">
    <div class="user-chip"><span id="user-name">...</span><div class="user-dot"></div></div>
    <button class="btn btn-logout" onclick="doLogout()">Esci</button>
  </div>
</header>
<div class="tabs-bar">
  <button class="tab-btn" onclick="location.href='../dashboard.html'">📊 Dashboard</button>
  <button class="tab-btn active">📈 Statistiche</button>
  <button class="tab-btn" id="t-comm" style="display:none" onclick="location.href='commerciali.html'">👥 Commerciali</button>
  <button class="tab-btn" id="t-prov" style="display:none" onclick="location.href='provvigioni.html'">💰 Provvigioni</button>
  <button class="tab-btn" id="t-tipi" style="display:none" onclick="location.href='tipi-contratto.html'">📋 Tipi Contratto</button>
  <button class="tab-btn" onclick="location.href='campagne.html'">🎯 Campagne</button>
</div>
<div class="page active">
  <h2 style="margin-bottom:20px">📈 Le Mie Statistiche</h2>
  <div class="filters-bar">
    <div class="filter-group">
      <label>PERIODO</label>
      <select class="form-input" id="periodo" onchange="load()">
        <option value="all">Tutto</option>
        <option value="year">Quest'anno</option>
        <option value="month">Questo mese</option>
      </select>
    </div>
  </div>
  <div class="kpi-strip">
    <div class="kpi-card c1"><div class="kpi-label">Contratti</div><div class="kpi-value" id="k1">—</div></div>
    <div class="kpi-card c2"><div class="kpi-label">Firmati</div><div class="kpi-value" id="k2">—</div></div>
    <div class="kpi-card c3"><div class="kpi-label">Conversione</div><div class="kpi-value" id="k3">—</div></div>
    <div class="kpi-card c4"><div class="kpi-label">Importo Tot.</div><div class="kpi-value" id="k4">—</div></div>
  </div>
  <div class="table-card">
    <div class="table-card-header"><h3>Per Tipo Contratto</h3></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Tipo</th><th>Totale</th><th>Firmati</th><th>In Attesa</th><th>Conversione</th></tr></thead>
        <tbody id="t1"><tr><td colspan="5" style="text-align:center;padding:30px">Caricamento...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="table-card">
    <div class="table-card-header"><h3>Per Mese</h3></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Mese</th><th>Totale</th><th>Firmati</th><th>Conversione</th></tr></thead>
        <tbody id="t2"><tr><td colspan="4" style="text-align:center;padding:30px">Caricamento...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const URL='https://ohahuqlfzqckaevaffbt.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020';
const sess=localStorage.getItem('cna_crm');
if(!sess){location.href='../index.html';}
const me=JSON.parse(sess);
document.getElementById('user-name').textContent=me.nome+' '+me.cognome;
if(me.ruolo==='admin'||me.ruolo==='supervisore'){document.getElementById('t-comm').style.display='';document.getElementById('t-prov').style.display='';}
if(me.ruolo==='admin'){document.getElementById('t-tipi').style.display='';}
function doLogout(){localStorage.removeItem('cna_crm');location.href='../index.html';}
async function get(ep){const r=await fetch(URL+'/rest/v1/'+ep,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();return Array.isArray(d)?d:[];}
function fmtDate(s){if(!s)return'-';return new Date(s).toLocaleDateString('it-IT');}
function badge(t,c){const m={success:'#D1FAE5|#065F46',warning:'#FEF3C7|#92400E',info:'#DBEAFE|#1E40AF'};const[bg,fg]=(m[c]||'#F1F5F9|#475569').split('|');return '<span style="background:'+bg+';color:'+fg+';padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600">'+t+'</span>';}

async function load(){
  try{
    let list=await get('contratti?select=stato,tipo_contratto,created_at,quota_primo_anno_importo&created_by=eq.'+me.id+'&order=created_at.desc');
    const p=document.getElementById('periodo').value;
    const now=new Date();
    if(p==='year') list=list.filter(c=>new Date(c.created_at).getFullYear()===now.getFullYear());
    else if(p==='month') list=list.filter(c=>{const d=new Date(c.created_at);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
    const firm=list.filter(c=>c.stato==='firmato');
    const imp=list.reduce((s,c)=>s+parseFloat(c.quota_primo_anno_importo||0),0);
    document.getElementById('k1').textContent=list.length;
    document.getElementById('k2').textContent=firm.length;
    document.getElementById('k3').textContent=list.length?(firm.length/list.length*100).toFixed(1)+'%':'0%';
    document.getElementById('k4').textContent='€'+Math.round(imp).toLocaleString('it-IT');
    const byT={};list.forEach(c=>{const t=c.tipo_contratto||'modulo adesione';if(!byT[t])byT[t]={tot:0,firm:0};byT[t].tot++;if(c.stato==='firmato')byT[t].firm++;});
    document.getElementById('t1').innerHTML=Object.entries(byT).length?Object.entries(byT).map(([t,s])=>'<tr><td>'+t+'</td><td>'+s.tot+'</td><td>'+s.firm+'</td><td>'+(s.tot-s.firm)+'</td><td>'+badge((s.tot?(s.firm/s.tot*100).toFixed(1):0)+'%','success')+'</td></tr>').join(''):'<tr><td colspan="5" style="text-align:center;padding:30px">Nessun dato</td></tr>';
    const byM={};list.forEach(c=>{const d=new Date(c.created_at);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(!byM[k])byM[k]={tot:0,firm:0};byM[k].tot++;if(c.stato==='firmato')byM[k].firm++;});
    document.getElementById('t2').innerHTML=Object.keys(byM).length?Object.keys(byM).sort().reverse().map(k=>{const s=byM[k];const[y,m]=k.split('-');const nm=new Date(y,m-1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});return'<tr><td>'+nm+'</td><td>'+s.tot+'</td><td>'+s.firm+'</td><td>'+badge((s.tot?(s.firm/s.tot*100).toFixed(1):0)+'%','success')+'</td></tr>';}).join(''):'<tr><td colspan="4" style="text-align:center;padding:30px">Nessun dato</td></tr>';
  }catch(ex){document.getElementById('t1').innerHTML='<tr><td colspan="5" style="color:#EF4444;padding:20px">Errore: '+ex.message+'</td></tr>';}
}
load();
</script>
</body>
</html>
