<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM CNA - Tipi Contratto</title>
<link rel="stylesheet" href="../css/crm.css">
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://www.cnaroma.it/sites/default/files/80-anni-logo.png" class="logo-img" alt="CNA Roma">
    <span class="header-title">CRM CNA</span>
  </div>
  <div class="header-right-wrap">
    <div class="user-chip"><span id="uname"></span><div class="user-dot"></div></div>
    <button class="btn btn-logout" onclick="logout()">Esci</button>
  </div>
</header>
<div class="tabs-bar">
  <button class="tab-btn" onclick="location.href='../dashboard.html'">📊 Dashboard</button>
  <button class="tab-btn" onclick="location.href='statistiche.html'">📈 Statistiche</button>
  <button class="tab-btn" id="t-comm" onclick="location.href='commerciali.html'">👥 Commerciali</button>
  <button class="tab-btn" id="t-prov" onclick="location.href='provvigioni.html'">💰 Provvigioni</button>
  <button class="tab-btn active" id="t-tipi">📋 Tipi Contratto</button>
  <button class="tab-btn" onclick="location.href='campagne.html'">🎯 Campagne</button>
  <button class="tab-btn" id="t-utenti" style="display:none" onclick="location.href='utenti.html'">👤 Utenti</button>
</div>
<div class="page active">
  <h2 style="margin-bottom:20px;font-size:20px;font-weight:800">📋 Tipi Contratto e Provvigioni</h2>
  <div class="upload-card">
    <div class="upload-title">➕ Nuovo Tipo Contratto</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div class="filter-group"><label>Nome Tipo Contratto</label><input type="text" class="form-input" id="n-nome" placeholder="es. Modulo Adesione"></div>
      <div class="filter-group"><label>Provvigione %</label><input type="number" class="form-input" id="n-perc" placeholder="10" min="0" max="100" step="0.1" style="max-width:120px"></div>
      <button class="btn btn-primary" onclick="aggiungi()">➕ Aggiungi</button>
    </div>
  </div>
  <div class="table-card">
    <div class="table-card-header"><h3>📋 Elenco Tipi</h3><span id="cnt">0</span></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Nome</th><th>Provvigione %</th><th>Attivo</th><th>Data Creazione</th><th>Azioni</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="5" style="text-align:center;padding:40px;color:#94A3B8">Caricamento...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>

const SB="https://ohahuqlfzqckaevaffbt.supabase.co";
const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020";
const _s=localStorage.getItem("cna_crm");if(!_s){location.href="../index.html";}
const me=JSON.parse(_s);
document.getElementById("uname").textContent=me.nome+" "+me.cognome;
if(me.ruolo==="admin"||me.ruolo==="supervisore"){var _e=document.getElementById("t-comm");if(_e)_e.style.display="";_e=document.getElementById("t-prov");if(_e)_e.style.display="";}
if(me.ruolo==="admin"){var _e=document.getElementById("t-tipi");if(_e)_e.style.display="";}
async function dbGet(ep){const r=await fetch(SB+"/rest/v1/"+ep,{headers:{"apikey":SK,"Authorization":"Bearer "+SK}});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPost(ep,b){const r=await fetch(SB+"/rest/v1/"+ep,{method:"POST",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPatch(ep,b){await fetch(SB+"/rest/v1/"+ep,{method:"PATCH",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json"},body:JSON.stringify(b)});}
async function dbDel(ep){await fetch(SB+"/rest/v1/"+ep,{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}});}
function fDate(s){if(!s)return"-";return new Date(s).toLocaleDateString("it-IT");}
function fEur(v){return"€ "+parseFloat(v||0).toLocaleString("it-IT",{minimumFractionDigits:2});}
function badge(t,c){const m={success:"#D1FAE5|#065F46",warning:"#FEF3C7|#92400E",danger:"#FEE2E2|#991B1B",info:"#DBEAFE|#1E40AF"};const[bg,fg]=(m[c]||"#F1F5F9|#475569").split("|");return"<span class=\"badge\" style=\"background:"+bg+";color:"+fg+"\">"+t+"</span>";}
function logout(){localStorage.removeItem("cna_crm");location.href="../index.html";}
if(me.ruolo!=="admin"){location.href="../dashboard.html";}
var _tu=document.getElementById("t-utenti"); if(_tu&&me.ruolo==="admin") _tu.style.display="";
let tipi=[];
async function load(){
  try{
    tipi=await dbGet("contract_types?select=*&order=created_at.desc");
    document.getElementById("cnt").textContent=tipi.length+" tipi";
    const tbody=document.getElementById("tbody");
    if(!tipi.length){tbody.innerHTML="<tr><td colspan=\"5\" style=\"text-align:center;padding:40px;color:#94A3B8\">Nessun tipo definito</td></tr>";return;}
    tbody.innerHTML=tipi.map(t=>{
      const nome=t.name||t.nome||"-";
      const perc=t.base_commission_pct||"-";
      return"<tr>"+
        "<td><strong>"+nome+"</strong></td>"+
        "<td>"+badge(perc+"%","success")+"</td>"+
        "<td>"+badge(t.is_active?"Attivo":"Disattivo",t.is_active?"success":"warning")+"</td>"+
        "<td>"+fDate(t.created_at)+"</td>"+
        "<td><button class=\"btn btn-danger\" onclick=\"elimina('"+t.id+"','"+nome.replace(/'/g,"\'")+"')\">🗑️ Elimina</button></td>"+
        "</tr>";
    }).join("");
  }catch(ex){document.getElementById("tbody").innerHTML="<tr><td colspan=\"5\" style=\"color:#EF4444;padding:20px\">Errore: "+ex.message+"</td></tr>";}
}
async function aggiungi(){
  const nome=document.getElementById("n-nome").value.trim();
  const perc=parseFloat(document.getElementById("n-perc").value);
  if(!nome){alert("Inserisci il nome");return;}
  if(isNaN(perc)||perc<0||perc>100){alert("Percentuale non valida (0-100)");return;}
  try{
    await dbPost("contract_types",{name:nome,base_commission_pct:perc,is_active:true});
    document.getElementById("n-nome").value="";document.getElementById("n-perc").value="";
    load();
  }catch(ex){alert("Errore: "+ex.message);}
}
async function elimina(id,nome){
  if(!confirm("Eliminare \""+nome+"\"?"))return;
  try{
    await dbPatch("contract_types?id=eq."+id,{is_active:false});
    load();
  }catch(ex){alert("Errore: "+ex.message);}
}
load();
</script>
</body>
</html>
