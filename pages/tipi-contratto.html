<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Tipi Contratto</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div class="tabs-bar" id="nav"></div>
  <div class="page active">
    <h2 style="margin-bottom:20px">📋 Tipi Contratto e Provvigioni</h2>
    <div class="upload-card" style="margin-bottom:24px">
      <h3 class="upload-title">➕ Nuovo Tipo Contratto</h3>
      <div style="display:grid;grid-template-columns:2fr 1fr auto;gap:16px;align-items:flex-end">
        <div><label style="font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;display:block;margin-bottom:6px">Nome</label>
          <input type="text" class="form-input" id="n-nome" placeholder="es. Modulo Adesione"></div>
        <div><label style="font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;display:block;margin-bottom:6px">Provvigione %</label>
          <input type="number" class="form-input" id="n-perc" placeholder="10" min="0" max="100" step="0.1"></div>
        <button class="btn btn-primary" onclick="aggiungi()">➕ Aggiungi</button>
      </div>
    </div>
    <div class="table-card">
      <div class="table-card-header"><h3>📋 Elenco Tipi</h3><span id="cnt">0</span></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Nome</th><th>Provvigione %</th><th>Data Creazione</th><th>Azioni</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../js/crm.js"></script>
<script>
const me = Auth.check('../index.html');
if (me.ruolo !== 'admin') { location.href = '../dashboard.html'; }
document.getElementById('hdr').innerHTML = buildHeader(me);
document.getElementById('nav').innerHTML = buildNav('📋 Tipi Contratto', '../');

let tipi = [], rules = [];

async function load() {
  tipi = await api('contract_types?select=*&order=created_at.desc');
  rules = await api('commission_rules?select=*');
  document.getElementById('cnt').textContent = tipi.length + ' tipi';
  const tbody = document.getElementById('tbody');
  if (!tipi.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px">Nessun tipo definito</td></tr>'; return; }
  tbody.innerHTML = tipi.map(t => {
    const rule = rules.find(r => r.tipo_contratto === t.nome);
    const perc = rule ? rule.percentuale : '-';
    return '<tr>' +
      '<td><strong>' + t.nome + '</strong></td>' +
      '<td>' + badge(perc + '%', 'success') + '</td>' +
      '<td>' + fmt_date(t.created_at) + '</td>' +
      '<td><button class="btn btn-danger" onclick="elimina(\'' + t.id + '\',\'' + t.nome + '\')">🗑️</button></td>' +
      '</tr>';
  }).join('');
}

async function aggiungi() {
  const nome = document.getElementById('n-nome').value.trim();
  const perc = parseFloat(document.getElementById('n-perc').value);
  if (!nome) { alert('Inserisci il nome'); return; }
  if (isNaN(perc) || perc < 0 || perc > 100) { alert('Inserisci percentuale valida'); return; }
  try {
    await api('contract_types', 'POST', { nome, created_by: me.id });
    await api('commission_rules', 'POST', { tipo_contratto: nome, percentuale: perc, created_by: me.id });
    document.getElementById('n-nome').value = '';
    document.getElementById('n-perc').value = '';
    load();
  } catch(ex) { alert('Errore: ' + ex.message); }
}

async function elimina(id, nome) {
  if (!confirm('Eliminare "' + nome + '"?')) return;
  try {
    await api('commission_rules?tipo_contratto=eq.' + encodeURIComponent(nome), 'DELETE');
    await api('contract_types?id=eq.' + id, 'DELETE');
    load();
  } catch(ex) { alert('Errore: ' + ex.message); }
}

load();
</script>
</body>
</html>
