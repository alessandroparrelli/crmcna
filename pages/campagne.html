<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM CNA - Campagne</title>
<link rel="stylesheet" href="../css/crm.css">
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" class="logo-img" alt="CNA">
    <span class="header-title">CRM CNA</span>
  </div>
  <div class="header-right-wrap">
    <div class="user-chip"><span id="uname"></span><div class="user-dot"></div></div>
    <button class="btn btn-logout" onclick="logout()">Esci</button>
  </div>
</header>
<div class="tabs-bar">
  <button class="tab-btn" onclick="location.href='../dashboard.html'">📊 Dashboard</button>
  <button class="tab-btn" onclick="location.href='statistiche.html'">📈 Statistiche</button>
  <button class="tab-btn" id="t-comm" style="display:none" onclick="location.href='commerciali.html'">👥 Commerciali</button>
  <button class="tab-btn" id="t-prov" style="display:none" onclick="location.href='provvigioni.html'">💰 Provvigioni</button>
  <button class="tab-btn" id="t-tipi" style="display:none" onclick="location.href='tipi-contratto.html'">📋 Tipi Contratto</button>
  <button class="tab-btn active">🎯 Campagne</button>
</div>
<div class="page active">
  <h2 style="margin-bottom:20px;font-size:20px;font-weight:800">🎯 Campagne</h2>
  <div id="crea-box" class="upload-card" style="display:none">
    <div class="upload-title">➕ Nuova Campagna</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div class="filter-group">
        <label>Nome Campagna</label>
        <input type="text" class="form-input" id="n-nome" placeholder="es. Campagna Primavera 2026" style="min-width:280px">
      </div>
      <button class="btn btn-primary" onclick="creaCampagna()">➕ Crea</button>
    </div>
  </div>
  <div class="filters-bar">
    <div class="filter-group">
      <label>STATO</label>
      <select class="form-input" id="f-stato" onchange="render()">
        <option value="">Tutte</option>
        <option value="attiva">Attiva</option>
        <option value="completata">Completata</option>
      </select>
    </div>
  </div>
  <div class="kpi-strip">
    <div class="kpi-card c1"><div class="kpi-label">Campagne</div><div class="kpi-value" id="k1">—</div></div>
    <div class="kpi-card c2"><div class="kpi-label">Attive</div><div class="kpi-value" id="k2">—</div></div>
    <div class="kpi-card c3"><div class="kpi-label">Leads Totali</div><div class="kpi-value" id="k3">—</div></div>
    <div class="kpi-card c4"><div class="kpi-label">Contratti</div><div class="kpi-value" id="k4">—</div></div>
  </div>
  <div class="table-card">
    <div class="table-card-header"><h3>🎯 Elenco Campagne</h3><span id="cnt">0</span></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Nome</th><th>Data</th><th>Leads</th><th>Contratti</th><th>Stato</th><th>Azioni</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" style="text-align:center;padding:40px;color:#94A3B8">Caricamento...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>

const SB="https://ohahuqlfzqckaevaffbt.supabase.co";
const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020";
const _s=localStorage.getItem("cna_crm");if(!_s){location.href="../index.html";}
const me=JSON.parse(_s);
document.getElementById("uname").textContent=me.nome+" "+me.cognome;
if(me.ruolo==="admin"||me.ruolo==="supervisore"){var _e=document.getElementById("t-comm");if(_e)_e.style.display="";_e=document.getElementById("t-prov");if(_e)_e.style.display="";}
if(me.ruolo==="admin"){var _e=document.getElementById("t-tipi");if(_e)_e.style.display="";}
async function dbGet(ep){const r=await fetch(SB+"/rest/v1/"+ep,{headers:{"apikey":SK,"Authorization":"Bearer "+SK}});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPost(ep,b){const r=await fetch(SB+"/rest/v1/"+ep,{method:"POST",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPatch(ep,b){await fetch(SB+"/rest/v1/"+ep,{method:"PATCH",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json"},body:JSON.stringify(b)});}
async function dbDel(ep){await fetch(SB+"/rest/v1/"+ep,{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}});}
function fDate(s){if(!s)return"-";return new Date(s).toLocaleDateString("it-IT");}
function fEur(v){return"€ "+parseFloat(v||0).toLocaleString("it-IT",{minimumFractionDigits:2});}
function badge(t,c){const m={success:"#D1FAE5|#065F46",warning:"#FEF3C7|#92400E",danger:"#FEE2E2|#991B1B",info:"#DBEAFE|#1E40AF"};const[bg,fg]=(m[c]||"#F1F5F9|#475569").split("|");return"<span class=\"badge\" style=\"background:"+bg+";color:"+fg+"\">"+t+"</span>";}
function logout(){localStorage.removeItem("cna_crm");location.href="../index.html";}
if(me.ruolo==="admin"||me.ruolo==="supervisore")document.getElementById("crea-box").style.display="block";
let campagne=[],leadsMap={};
async function init(){
  try{
    campagne=await dbGet("campaigns?select=*&order=created_at.desc");
    for(const c of campagne){
      const l=await dbGet("campaign_leads?campaign_id=eq."+c.id+"&select=stato");
      leadsMap[c.id]=l;
    }
    render();
  }catch(ex){document.getElementById("tbody").innerHTML="<tr><td colspan=\"6\" style=\"color:#EF4444;padding:20px\">Errore: "+ex.message+"</td></tr>";}
}
function render(){
  let list=campagne.slice();
  const fs=document.getElementById("f-stato").value;if(fs)list=list.filter(c=>c.stato===fs);
  const tL=list.reduce((s,c)=>s+(leadsMap[c.id]||[]).length,0);
  const tC=list.reduce((s,c)=>s+(leadsMap[c.id]||[]).filter(l=>l.stato==="contratto_generato").length,0);
  document.getElementById("k1").textContent=list.length;
  document.getElementById("k2").textContent=list.filter(c=>c.stato==="attiva"||!c.stato).length;
  document.getElementById("k3").textContent=tL;
  document.getElementById("k4").textContent=tC;
  document.getElementById("cnt").textContent=list.length+" campagne";
  const tbody=document.getElementById("tbody");
  if(!list.length){tbody.innerHTML="<tr><td colspan=\"6\" style=\"text-align:center;padding:40px;color:#94A3B8\">Nessuna campagna</td></tr>";return;}
  tbody.innerHTML=list.map(c=>{
    const leads=leadsMap[c.id]||[];
    const contr=leads.filter(l=>l.stato==="contratto_generato").length;
    const stato=c.stato||"attiva";
    return"<tr>"+
      "<td><strong>"+c.nome+"</strong></td>"+
      "<td>"+fDate(c.created_at)+"</td>"+
      "<td>"+leads.length+"</td>"+
      "<td>"+badge(contr,"success")+"</td>"+
      "<td>"+badge(stato,stato==="attiva"?"success":"")+"</td>"+
      "<td><button class=\"btn btn-primary\" onclick=\"location.href='campagna-dettaglio.html?id="+c.id+"'\">👁️ Apri</button></td>"+
      "</tr>";
  }).join("");
}
async function creaCampagna(){
  const nome=document.getElementById("n-nome").value.trim();
  if(!nome){alert("Inserisci il nome");return;}
  try{await dbPost("campaigns",{nome,stato:"attiva",created_by:me.id});document.getElementById("n-nome").value="";init();}
  catch(ex){alert("Errore: "+ex.message);}
}
init();
</script>
</body>
</html>
