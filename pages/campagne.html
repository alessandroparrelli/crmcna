<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Campagne</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div class="tabs-bar" id="nav"></div>
  <div class="page active">
    <h2 style="margin-bottom:20px">🎯 Campagne</h2>

    <!-- Crea nuova (admin/supervisore) -->
    <div id="crea-box" style="display:none" class="upload-card">
      <h3 class="upload-title">➕ Nuova Campagna</h3>
      <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
        <div class="filter-group">
          <label>Nome Campagna</label>
          <input type="text" class="form-input" id="n-nome" placeholder="es. Campagna Primavera 2026">
        </div>
        <button class="btn btn-primary" onclick="creaCampagna()">➕ Crea</button>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <label>STATO</label>
        <select class="form-input" id="f-stato" onchange="render()">
          <option value="">Tutte</option>
          <option value="attiva">Attiva</option>
          <option value="completata">Completata</option>
        </select>
      </div>
    </div>

    <div class="kpi-strip">
      <div class="kpi-card c1"><div class="kpi-label">Campagne Totali</div><div class="kpi-value" id="k1">0</div></div>
      <div class="kpi-card c2"><div class="kpi-label">Attive</div><div class="kpi-value" id="k2">0</div></div>
      <div class="kpi-card c3"><div class="kpi-label">Leads Totali</div><div class="kpi-value" id="k3">0</div></div>
      <div class="kpi-card c4"><div class="kpi-label">Contratti Generati</div><div class="kpi-value" id="k4">0</div></div>
    </div>

    <div class="table-card">
      <div class="table-card-header"><h3>🎯 Elenco Campagne</h3><span id="cnt">0</span></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Nome</th><th>Data Creazione</th><th>Leads</th><th>Contratti</th><th>Stato</th><th>Azioni</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../js/crm.js"></script>
<script>
const me = Auth.check('../index.html');
document.getElementById('hdr').innerHTML = buildHeader(me);
document.getElementById('nav').innerHTML = buildNav('🎯 Campagne', '../');

if (me.ruolo === 'admin' || me.ruolo === 'supervisore') {
  document.getElementById('crea-box').style.display = 'block';
}

let campagne = [], leadsMap = {};

async function init() {
  try {
    campagne = await api('campaigns?select=*&order=created_at.desc');
    // Carica leads counts
    for (const c of campagne) {
      const leads = await api('campaign_leads?campaign_id=eq.' + c.id + '&select=stato');
      leadsMap[c.id] = leads;
    }
    render();
  } catch(ex) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="6" style="color:#EF4444;padding:20px">Errore: ' + ex.message + '</td></tr>';
  }
}

function render() {
  let list = campagne.slice();
  const fs = document.getElementById('f-stato').value;
  if (fs) list = list.filter(c => c.stato === fs);

  const totLeads = list.reduce((s, c) => s + (leadsMap[c.id]||[]).length, 0);
  const totContr = list.reduce((s, c) => s + (leadsMap[c.id]||[]).filter(l => l.stato === 'contratto_generato').length, 0);

  document.getElementById('k1').textContent = list.length;
  document.getElementById('k2').textContent = list.filter(c => c.stato === 'attiva' || !c.stato).length;
  document.getElementById('k3').textContent = totLeads;
  document.getElementById('k4').textContent = totContr;
  document.getElementById('cnt').textContent = list.length + ' campagne';

  const tbody = document.getElementById('tbody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px">Nessuna campagna</td></tr>'; return; }
  tbody.innerHTML = list.map(c => {
    const leads = leadsMap[c.id] || [];
    const contratti = leads.filter(l => l.stato === 'contratto_generato').length;
    const stato = c.stato || 'attiva';
    return '<tr>' +
      '<td><strong>' + c.nome + '</strong></td>' +
      '<td>' + fmt_date(c.created_at) + '</td>' +
      '<td>' + leads.length + '</td>' +
      '<td>' + badge(contratti, 'success') + '</td>' +
      '<td>' + badge(stato, stato === 'attiva' ? 'success' : '') + '</td>' +
      '<td><button class="btn btn-primary" onclick="location.href=\'campagna-dettaglio.html?id=' + c.id + '\'">👁️ Apri</button></td>' +
      '</tr>';
  }).join('');
}

async function creaCampagna() {
  const nome = document.getElementById('n-nome').value.trim();
  if (!nome) { alert('Inserisci il nome'); return; }
  try {
    await api('campaigns', 'POST', { nome: nome, stato: 'attiva', created_by: me.id });
    document.getElementById('n-nome').value = '';
    init();
  } catch(ex) { alert('Errore: ' + ex.message); }
}

init();
</script>
</body>
</html>
