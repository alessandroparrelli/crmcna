<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM CNA - Dettaglio Campagna</title>
<link rel="stylesheet" href="../css/crm.css">
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://www.cnaroma.it/wp-content/uploads/2024/01/logo-cna-roma.png" class="logo-img" alt="CNA">
    <span class="header-title">CRM CNA</span>
  </div>
  <div class="header-right-wrap">
    <div class="user-chip"><span id="uname"></span><div class="user-dot"></div></div>
    <button class="btn btn-logout" onclick="logout()">Esci</button>
  </div>
</header>
<div class="tabs-bar">
  <button class="tab-btn" onclick="location.href='../dashboard.html'">📊 Dashboard</button>
  <button class="tab-btn" id="t-comm" style="display:none" onclick="location.href='commerciali.html'">👥 Commerciali</button>
  <button class="tab-btn active" onclick="location.href='campagne.html'">🎯 Campagne</button>
</div>
<div class="page active">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h2 id="titolo" style="font-size:20px;font-weight:800">Campagna</h2>
    <button class="btn btn-secondary" onclick="location.href='campagne.html'">← Indietro</button>
  </div>
  <div id="add-box" class="upload-card" style="display:none">
    <div class="upload-title">➕ Aggiungi Lead</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div class="filter-group"><label>Ragione Sociale</label><input type="text" class="form-input" id="a-rag" placeholder="Azienda"></div>
      <div class="filter-group"><label>Telefono</label><input type="text" class="form-input" id="a-tel" placeholder="+39..."></div>
      <div class="filter-group"><label>Assegna a</label><select class="form-input" id="a-op"><option value="">Nessuno</option></select></div>
      <button class="btn btn-primary" onclick="addLead()">➕ Aggiungi</button>
    </div>
  </div>
  <div class="filters-bar">
    <div class="filter-group">
      <label>STATO</label>
      <select class="form-input" id="f-stato" onchange="render()">
        <option value="">Tutti</option>
        <option value="da_lavorare">Da Lavorare</option>
        <option value="contattato">Contattato</option>
        <option value="da_richiamare">Da Richiamare</option>
        <option value="ko">KO</option>
        <option value="contratto_generato">Contratto Generato</option>
      </select>
    </div>
    <div class="filter-group" id="f-op-wrap" style="display:none">
      <label>OPERATORE</label>
      <select class="form-input" id="f-op" onchange="render()"><option value="">Tutti</option></select>
    </div>
  </div>
  <div class="kpi-strip">
    <div class="kpi-card c1"><div class="kpi-label">Leads Totali</div><div class="kpi-value" id="k1">—</div></div>
    <div class="kpi-card c2"><div class="kpi-label">Da Lavorare</div><div class="kpi-value" id="k2">—</div></div>
    <div class="kpi-card c3"><div class="kpi-label">Contattati</div><div class="kpi-value" id="k3">—</div></div>
    <div class="kpi-card c4"><div class="kpi-label">Contratti</div><div class="kpi-value" id="k4">—</div></div>
  </div>
  <div class="table-card">
    <div class="table-card-header"><h3>📞 Leads</h3><span id="cnt">0</span></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Ragione Sociale</th><th>Telefono</th><th>Stato</th><th>Operatore</th><th>Ultimo Contatto</th><th>Note</th><th>Azioni</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7" style="text-align:center;padding:40px;color:#94A3B8">Caricamento...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="m-tit">Gestisci Lead</div>
    <div class="form-group"><label>Stato</label>
      <select class="form-input" id="m-stato">
        <option value="da_lavorare">Da Lavorare</option>
        <option value="contattato">Contattato</option>
        <option value="da_richiamare">Da Richiamare</option>
        <option value="ko">KO</option>
        <option value="contratto_generato">Contratto Generato</option>
      </select>
    </div>
    <div class="form-group"><label>Note</label><textarea class="form-input" id="m-note" rows="3" placeholder="Note sulla chiamata..."></textarea></div>
    <div class="form-group" id="m-op-wrap" style="display:none"><label>Assegna a</label><select class="form-input" id="m-op"><option value="">Nessuno</option></select></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveModal()">💾 Salva</button>
      <button class="btn btn-secondary" onclick="document.getElementById('modal').classList.remove('open')">✕ Annulla</button>
    </div>
  </div>
</div>
<script>

const SB="https://ohahuqlfzqckaevaffbt.supabase.co";
const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020";
const _s=localStorage.getItem("cna_crm");if(!_s){location.href="../index.html";}
const me=JSON.parse(_s);
document.getElementById("uname").textContent=me.nome+" "+me.cognome;
if(me.ruolo==="admin"||me.ruolo==="supervisore"){var _e=document.getElementById("t-comm");if(_e)_e.style.display="";_e=document.getElementById("t-prov");if(_e)_e.style.display="";}
if(me.ruolo==="admin"){var _e=document.getElementById("t-tipi");if(_e)_e.style.display="";}
async function dbGet(ep){const r=await fetch(SB+"/rest/v1/"+ep,{headers:{"apikey":SK,"Authorization":"Bearer "+SK}});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPost(ep,b){const r=await fetch(SB+"/rest/v1/"+ep,{method:"POST",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPatch(ep,b){await fetch(SB+"/rest/v1/"+ep,{method:"PATCH",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json"},body:JSON.stringify(b)});}
async function dbDel(ep){await fetch(SB+"/rest/v1/"+ep,{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}});}
function fDate(s){if(!s)return"-";return new Date(s).toLocaleDateString("it-IT");}
function fEur(v){return"€ "+parseFloat(v||0).toLocaleString("it-IT",{minimumFractionDigits:2});}
function badge(t,c){const m={success:"#D1FAE5|#065F46",warning:"#FEF3C7|#92400E",danger:"#FEE2E2|#991B1B",info:"#DBEAFE|#1E40AF"};const[bg,fg]=(m[c]||"#F1F5F9|#475569").split("|");return"<span class=\"badge\" style=\"background:"+bg+";color:"+fg+"\">"+t+"</span>";}
function logout(){localStorage.removeItem("cna_crm");location.href="../index.html";}
const cid=new URLSearchParams(location.search).get("id");
if(!cid){location.href="campagne.html";}
let leads=[],operatori=[],editId=null;
async function init(){
  try{
    const camps=await dbGet("campaigns?id=eq."+cid+"&select=nome");
    if(camps.length)document.getElementById("titolo").textContent="📋 "+camps[0].nome;
    operatori=await dbGet("cna_users?ruolo=eq.utente&attivo=eq.true&select=id,nome,cognome&order=nome");
    const opOpts=operatori.map(o=>"<option value=\""+o.id+"\">"+o.nome+" "+o.cognome+"</option>").join("");
    ["a-op","m-op","f-op"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=(id==="f-op"?"<option value=\"\">Tutti</option>":"<option value=\"\">Nessuno</option>")+opOpts;});
    if(me.ruolo==="admin"||me.ruolo==="supervisore"){
      document.getElementById("add-box").style.display="block";
      document.getElementById("f-op-wrap").style.display="";
      document.getElementById("m-op-wrap").style.display="";
    }
    let q="campaign_leads?campaign_id=eq."+cid+"&select=*&order=created_at.desc";
    if(me.ruolo==="utente")q+="&assegnato_a=eq."+me.id;
    leads=await dbGet(q);
    render();
  }catch(ex){document.getElementById("tbody").innerHTML="<tr><td colspan=\"7\" style=\"color:#EF4444;padding:20px\">Errore: "+ex.message+"</td></tr>";}
}
function render(){
  let list=leads.slice();
  const fs=document.getElementById("f-stato").value;if(fs)list=list.filter(l=>l.stato===fs);
  if(me.ruolo!=="utente"){const fo=document.getElementById("f-op").value;if(fo)list=list.filter(l=>l.assegnato_a===fo);}
  document.getElementById("k1").textContent=list.length;
  document.getElementById("k2").textContent=list.filter(l=>!l.stato||l.stato==="da_lavorare").length;
  document.getElementById("k3").textContent=list.filter(l=>l.stato==="contattato"||l.stato==="da_richiamare").length;
  document.getElementById("k4").textContent=list.filter(l=>l.stato==="contratto_generato").length;
  document.getElementById("cnt").textContent=list.length+" leads";
  const SM={da_lavorare:"",contattato:"success",da_richiamare:"warning",ko:"danger",contratto_generato:"success"};
  const tbody=document.getElementById("tbody");
  if(!list.length){tbody.innerHTML="<tr><td colspan=\"7\" style=\"text-align:center;padding:40px;color:#94A3B8\">Nessun lead</td></tr>";return;}
  tbody.innerHTML=list.map(l=>{
    const op=operatori.find(o=>o.id===l.assegnato_a);
    const stato=l.stato||"da_lavorare";
    return"<tr>"+
      "<td><strong>"+(l.ragione_sociale||"-")+"</strong></td>"+
      "<td>"+(l.telefono||"-")+"</td>"+
      "<td>"+badge(stato.replace(/_/g," "),SM[stato]||"")+"</td>"+
      "<td>"+(op?op.nome+" "+op.cognome:"-")+"</td>"+
      "<td>"+fDate(l.ultimo_contatto)+"</td>"+
      "<td style=\"max-width:120px;overflow:hidden;text-overflow:ellipsis\">"+(l.note?l.note.substring(0,40)+"...":"-")+"</td>"+
      "<td><button class=\"btn btn-secondary\" onclick='openModal(\""+l.id+"\")'>✏️</button></td>"+
      "</tr>";
  }).join("");
}
function openModal(id){
  const l=leads.find(x=>x.id===id);if(!l)return;
  editId=id;
  document.getElementById("m-tit").textContent=l.ragione_sociale||"Lead";
  document.getElementById("m-stato").value=l.stato||"da_lavorare";
  document.getElementById("m-note").value=l.note||"";
  const mop=document.getElementById("m-op");
  if(mop)mop.value=l.assegnato_a||"";
  document.getElementById("modal").classList.add("open");
}
async function saveModal(){
  if(!editId)return;
  try{
    const upd={stato:document.getElementById("m-stato").value,note:document.getElementById("m-note").value||null,ultimo_contatto:new Date().toISOString()};
    const mop=document.getElementById("m-op");
    if(mop&&(me.ruolo==="admin"||me.ruolo==="supervisore"))upd.assegnato_a=mop.value||null;
    await dbPatch("campaign_leads?id=eq."+editId,upd);
    const l=leads.find(x=>x.id===editId);if(l)Object.assign(l,upd);
    document.getElementById("modal").classList.remove("open");
    render();
  }catch(ex){alert("Errore: "+ex.message);}
}
async function addLead(){
  const rag=document.getElementById("a-rag").value.trim();
  if(!rag){alert("Inserisci la ragione sociale");return;}
  try{
    const nl=await dbPost("campaign_leads",{campaign_id:cid,ragione_sociale:rag,telefono:document.getElementById("a-tel").value.trim()||null,assegnato_a:document.getElementById("a-op").value||null,stato:"da_lavorare",created_by:me.id});
    document.getElementById("a-rag").value="";document.getElementById("a-tel").value="";document.getElementById("a-op").value="";
    if(nl&&nl[0])leads.unshift(nl[0]);render();
  }catch(ex){alert("Errore: "+ex.message);}
}
init();
</script>
</body>
</html>
