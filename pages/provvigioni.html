<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM CNA - Provvigioni</title>
<link rel="stylesheet" href="../css/crm.css">
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://www.cnaroma.it/sites/default/files/80-anni-logo.png" class="logo-img" alt="CNA Roma">
    <span class="header-title">CRM CNA</span>
  </div>
  <div class="header-right-wrap">
    <div class="user-chip"><span id="uname"></span><div class="user-dot"></div></div>
    <button class="btn btn-logout" onclick="logout()">Esci</button>
  </div>
</header>
<div class="tabs-bar">
  <button class="tab-btn" onclick="location.href='../dashboard.html'">📊 Dashboard</button>
  <button class="tab-btn" onclick="location.href='statistiche.html'">📈 Statistiche</button>
  <button class="tab-btn" id="t-comm" onclick="location.href='commerciali.html'">👥 Commerciali</button>
  <button class="tab-btn active" id="t-prov">💰 Provvigioni</button>
  <button class="tab-btn" id="t-tipi" style="display:none" onclick="location.href='tipi-contratto.html'">📋 Tipi Contratto</button>
  <button class="tab-btn" onclick="location.href='campagne.html'">🎯 Campagne</button>
</div>
<div class="page active">
  <h2 style="margin-bottom:20px;font-size:20px;font-weight:800">💰 Gestione Provvigioni</h2>
  <div class="filters-bar">
    <div class="filter-group"><label>MESE</label><input type="month" class="form-input" id="f-mese" onchange="load()"></div>
    <div class="filter-group"><label>COMMERCIALE</label><select class="form-input" id="f-comm" onchange="load()"><option value="">Tutti</option></select></div>
  </div>
  <div class="kpi-strip">
    <div class="kpi-card c1"><div class="kpi-label">Totale Provvigioni</div><div class="kpi-value" id="k1">—</div></div>
    <div class="kpi-card c2"><div class="kpi-label">Contratti</div><div class="kpi-value" id="k2">—</div></div>
    <div class="kpi-card c3"><div class="kpi-label">Media/Commerciale</div><div class="kpi-value" id="k3">—</div></div>
    <div class="kpi-card c4"><div class="kpi-label">Commerciali</div><div class="kpi-value" id="k4">—</div></div>
  </div>
  <div class="table-card">
    <div class="table-card-header"><h3>💰 Provvigioni per Commerciale</h3></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Commerciale</th><th>Contratti Firmati</th><th>Importo Totale</th><th>% Provvigione</th><th>Provvigione €</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="5" style="text-align:center;padding:40px;color:#94A3B8">Seleziona un mese per calcolare</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>

const SB="https://ohahuqlfzqckaevaffbt.supabase.co";
const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWh1cWxmenFja2FldmFmZmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODI4NzQsImV4cCI6MjA4OTc1ODg3NH0.MG1N3UUIfISDAi_ArFjxN6ZlHJfk5D77vSeE7qZr020";
const _s=localStorage.getItem("cna_crm");if(!_s){location.href="../index.html";}
const me=JSON.parse(_s);
document.getElementById("uname").textContent=me.nome+" "+me.cognome;
if(me.ruolo==="admin"||me.ruolo==="supervisore"){var _e=document.getElementById("t-comm");if(_e)_e.style.display="";_e=document.getElementById("t-prov");if(_e)_e.style.display="";}
if(me.ruolo==="admin"){var _e=document.getElementById("t-tipi");if(_e)_e.style.display="";}
async function dbGet(ep){const r=await fetch(SB+"/rest/v1/"+ep,{headers:{"apikey":SK,"Authorization":"Bearer "+SK}});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPost(ep,b){const r=await fetch(SB+"/rest/v1/"+ep,{method:"POST",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());const d=await r.json();return Array.isArray(d)?d:[];}
async function dbPatch(ep,b){await fetch(SB+"/rest/v1/"+ep,{method:"PATCH",headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json"},body:JSON.stringify(b)});}
async function dbDel(ep){await fetch(SB+"/rest/v1/"+ep,{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}});}
function fDate(s){if(!s)return"-";return new Date(s).toLocaleDateString("it-IT");}
function fEur(v){return"€ "+parseFloat(v||0).toLocaleString("it-IT",{minimumFractionDigits:2});}
function badge(t,c){const m={success:"#D1FAE5|#065F46",warning:"#FEF3C7|#92400E",danger:"#FEE2E2|#991B1B",info:"#DBEAFE|#1E40AF"};const[bg,fg]=(m[c]||"#F1F5F9|#475569").split("|");return"<span class=\"badge\" style=\"background:"+bg+";color:"+fg+"\">"+t+"</span>";}
function logout(){localStorage.removeItem("cna_crm");location.href="../index.html";}
if(me.ruolo!=="admin"&&me.ruolo!=="supervisore"){location.href="../dashboard.html";}
const now=new Date();
document.getElementById("f-mese").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
let comms=[],tipiContratto=[];
async function init(){
  try{
    comms=await dbGet("cna_users?ruolo=eq.commerciale&attivo=eq.true&select=id,nome,cognome&order=nome");
    tipiContratto=await dbGet("contract_types?select=name,base_commission_pct&is_active=eq.true");
    document.getElementById("k4").textContent=comms.length;
    const sel=document.getElementById("f-comm");
    comms.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.nome+" "+c.cognome;sel.appendChild(o);});
    load();
  }catch(ex){document.getElementById("tbody").innerHTML="<tr><td colspan=\"5\" style=\"color:#EF4444;padding:20px\">Errore init: "+ex.message+"</td></tr>";}
}
async function load(){
  const mese=document.getElementById("f-mese").value;if(!mese)return;
  const[y,m]=mese.split("-");
  const start=new Date(y,m-1,1).toISOString();
  const end=new Date(y,m,0,23,59,59).toISOString();
  let filtered=comms.slice();
  const fc=document.getElementById("f-comm").value;if(fc)filtered=filtered.filter(c=>c.id===fc);
  try{
    const rows=[];
    for(const comm of filtered){
      // Usa stato=firmato invece di validato (campo non esiste)
      const cs=await dbGet("contratti?created_by=eq."+comm.id+"&stato=eq.firmato&created_at=gte."+start+"&created_at=lte."+end+"&select=tipo_contratto,quota_primo_anno_importo");
      if(!cs.length)continue;
      let totImp=0,totProv=0;
      cs.forEach(c=>{
        const imp=parseFloat(c.quota_primo_anno_importo||0);
        totImp+=imp;
        // Cerca percentuale da contract_types
        const tipo=tipiContratto.find(t=>(t.name||"").toLowerCase()===(c.tipo_contratto||"").toLowerCase());
        const perc=tipo?parseFloat(tipo.base_commission_pct||10):10;
        totProv+=imp*perc/100;
      });
      rows.push({comm,n:cs.length,imp:totImp,prov:totProv,perc:totImp>0?(totProv/totImp*100).toFixed(1):0});
    }
    const totP=rows.reduce((s,r)=>s+r.prov,0);
    const totC=rows.reduce((s,r)=>s+r.n,0);
    document.getElementById("k1").textContent=fEur(totP);
    document.getElementById("k2").textContent=totC;
    document.getElementById("k3").textContent=fEur(rows.length?totP/rows.length:0);
    const tbody=document.getElementById("tbody");
    if(!rows.length){tbody.innerHTML="<tr><td colspan=\"5\" style=\"text-align:center;padding:40px;color:#94A3B8\">Nessuna provvigione nel periodo</td></tr>";return;}
    tbody.innerHTML=rows.map(r=>"<tr>"+
      "<td><strong>"+r.comm.nome+" "+r.comm.cognome+"</strong></td>"+
      "<td>"+r.n+"</td>"+
      "<td>"+fEur(r.imp)+"</td>"+
      "<td>"+r.perc+"%</td>"+
      "<td><strong style=\"color:#10B981\">"+fEur(r.prov)+"</strong></td>"+
      "</tr>").join("");
  }catch(ex){document.getElementById("tbody").innerHTML="<tr><td colspan=\"5\" style=\"color:#EF4444;padding:20px\">Errore: "+ex.message+"</td></tr>";}
}
init();
</script>
</body>
</html>
