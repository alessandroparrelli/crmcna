<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM CNA - Provvigioni</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div class="tabs-bar" id="nav"></div>
  <div class="page active">
    <h2 style="margin-bottom:20px">💰 Gestione Provvigioni</h2>
    <div class="filters-bar">
      <div class="filter-group">
        <label>MESE</label>
        <input type="month" class="form-input" id="f-mese" onchange="load()">
      </div>
      <div class="filter-group">
        <label>COMMERCIALE</label>
        <select class="form-input" id="f-comm" onchange="load()"><option value="">Tutti</option></select>
      </div>
    </div>
    <div class="kpi-strip">
      <div class="kpi-card c1"><div class="kpi-label">Totale Provvigioni</div><div class="kpi-value" id="k1">€0</div></div>
      <div class="kpi-card c2"><div class="kpi-label">Contratti</div><div class="kpi-value" id="k2">0</div></div>
      <div class="kpi-card c3"><div class="kpi-label">Media Comm.</div><div class="kpi-value" id="k3">€0</div></div>
      <div class="kpi-card c4"><div class="kpi-label">Commerciali</div><div class="kpi-value" id="k4">0</div></div>
    </div>
    <div class="table-card">
      <div class="table-card-header"><h3>💰 Dettaglio per Commerciale</h3></div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Commerciale</th><th>Contratti Validati</th><th>Importo Totale</th><th>% Provvigione</th><th>Provvigione €</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../js/crm.js"></script>
<script>
const me = Auth.check('../index.html');
if (me.ruolo !== 'admin' && me.ruolo !== 'supervisore') { location.href = '../dashboard.html'; }
document.getElementById('hdr').innerHTML = buildHeader(me);
document.getElementById('nav').innerHTML = buildNav('💰 Provvigioni', '../');

const now = new Date();
document.getElementById('f-mese').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

let comms = [], rules = [];

async function init() {
  comms = await api('cna_users?ruolo=eq.commerciale&attivo=eq.true&select=id,nome,cognome&order=nome');
  rules = await api('commission_rules?select=*');
  document.getElementById('k4').textContent = comms.length;
  const sel = document.getElementById('f-comm');
  comms.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.nome + ' ' + c.cognome; sel.appendChild(o); });
  load();
}

async function load() {
  try {
    const mese = document.getElementById('f-mese').value;
    if (!mese) return;
    const [y, m] = mese.split('-');
    const start = new Date(y, m-1, 1).toISOString();
    const end = new Date(y, m, 0, 23, 59, 59).toISOString();
    
    let filtered = comms;
    const fc = document.getElementById('f-comm').value;
    if (fc) filtered = comms.filter(c => c.id === fc);

    const rows = [];
    for (const comm of filtered) {
      const contratti = await api('contratti?created_by=eq.' + comm.id + '&validato=eq.true&created_at=gte.' + start + '&created_at=lte.' + end + '&select=tipo_contratto,quota_primo_anno_importo');
      if (!contratti.length) continue;
      let totImporto = 0, totProv = 0;
      contratti.forEach(c => {
        const imp = parseFloat(c.quota_primo_anno_importo || 0);
        totImporto += imp;
        const rule = rules.find(r => r.tipo_contratto === c.tipo_contratto);
        const perc = rule ? rule.percentuale : 10;
        totProv += imp * perc / 100;
      });
      rows.push({ comm, n: contratti.length, importo: totImporto, provv: totProv, perc: totImporto > 0 ? (totProv/totImporto*100).toFixed(1) : 0 });
    }

    const totP = rows.reduce((s,r) => s + r.provv, 0);
    const totC = rows.reduce((s,r) => s + r.n, 0);
    document.getElementById('k1').textContent = fmt_currency(totP);
    document.getElementById('k2').textContent = totC;
    document.getElementById('k3').textContent = fmt_currency(rows.length ? totP/rows.length : 0);

    const tbody = document.getElementById('tbody');
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px">Nessuna provvigione nel periodo</td></tr>'; return; }
    tbody.innerHTML = rows.map(r => '<tr>' +
      '<td><strong>' + r.comm.nome + ' ' + r.comm.cognome + '</strong></td>' +
      '<td>' + r.n + '</td>' +
      '<td>' + fmt_currency(r.importo) + '</td>' +
      '<td>' + r.perc + '%</td>' +
      '<td><strong style="color:#10B981">' + fmt_currency(r.provv) + '</strong></td>' +
      '</tr>').join('');
  } catch(ex) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="5" style="color:#EF4444;padding:20px">Errore: ' + ex.message + '</td></tr>';
  }
}

init();
</script>
</body>
</html>
